[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellscripts-py"
version = "0.1.0"
description = "Python equivalents for the ShellScripts bash utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shellscripts = "shellscripts_py.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
